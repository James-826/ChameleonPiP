<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .pip-root {
        position: relative;
        width: 100%;
        height: 100%;
        background: transparent !important;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
      }

      .pip-root.hovered:not(.boss-active) {
        box-shadow: inset 0 0 0 1px rgba(52, 211, 153, 0.22);
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
      }
      .stage:active { cursor: grabbing; }

      .media-el {
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: transparent !important;
        pointer-events: none;
        will-change: transform;
        transform: translateZ(0);
        backface-visibility: hidden;
      }

      /* Optional CRT Scanline overlay in `pixel` mode */
      .scanline-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background-image: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.22) 0px,
          rgba(0, 0, 0, 0.22) 1px,
          transparent 1px,
          transparent 3px
        );
      }
      .pip-root[data-mode="pixel"] .scanline-overlay {
        opacity: 1;
      }

      .subtitle-el {
        position: absolute;
        bottom: 14px;
        left: 8%;
        right: 8%;
        text-align: center;
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.35;
        pointer-events: none;
        transition: bottom 0.18s ease, color 0.2s ease;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
      }
      .subtitle-el.stealth-log {
        bottom: 8px;
        left: 8px;
        right: 8px;
        text-align: left;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "SF Mono", monospace;
        font-size: 10.5px;
        font-weight: 500;
        line-height: 1.4;
        padding: 5px 9px;
        border-radius: 6px;
        background: rgba(13, 17, 23, 0.86);
        border: 1px solid rgba(52, 211, 153, 0.24);
        color: #c9d1d9;
        text-shadow: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .subtitle-el.stealth-log.light-bg {
        background: rgba(248, 250, 252, 0.9);
        border-color: rgba(15, 23, 42, 0.16);
        color: #1e293b;
      }
      .subtitle-el.stealth-log .log-ts { color: #64748b; }
      .subtitle-el.stealth-log .log-lv { color: #34d399; font-weight: 700; }
      .subtitle-el.stealth-log.light-bg .log-lv { color: #059669; }
      .subtitle-el.stealth-log .log-mod { color: #79c0ff; }
      .subtitle-el.stealth-log.light-bg .log-mod { color: #0284c7; }
      .pip-root.hovered .subtitle-el {
        bottom: 66px;
      }
      .icon-btn.active {
        background: rgba(16, 185, 129, 0.28);
        border-color: rgba(52, 211, 153, 0.65);
        color: #a7f3d0;
      }

      /* Top & Bottom Hover Glass Bars */
      .hud-top {
        position: absolute;
        top: 0; left: 0; right: 0; height: 46px;
        padding: 10px 12px 4px 12px;
        display: flex; align-items: center; justify-content: space-between;
        background: linear-gradient(to bottom, rgba(8, 12, 18, 0.86) 0%, rgba(8, 12, 18, 0.36) 72%, transparent 100%);
        opacity: 0; pointer-events: none; transition: opacity 0.16s ease; z-index: 65;
      }
      .hud-bottom {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        padding: 10px 14px 10px 12px;
        display: flex; flex-direction: column; gap: 6px;
        background: linear-gradient(to top, rgba(8, 12, 18, 0.9) 0%, rgba(8, 12, 18, 0.5) 72%, transparent 100%);
        opacity: 0; pointer-events: none; transition: opacity 0.16s ease; z-index: 65;
      }
      .pip-root.hovered:not(.boss-active) .hud-top,
      .pip-root.hovered:not(.boss-active) .hud-bottom {
        opacity: 1; pointer-events: auto;
      }

      .pill-group {
        display: inline-flex; align-items: center;
        background: rgba(18, 24, 34, 0.78);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 7px; padding: 2px; gap: 1px;
      }
      .seg-btn {
        appearance: none; border: none; background: transparent;
        color: rgba(226, 232, 240, 0.8); font-size: 10.5px; font-weight: 500;
        padding: 3px 7px; border-radius: 5px; cursor: pointer;
      }
      .seg-btn:hover { color: #fff; }
      .seg-btn.active { background: rgba(52, 211, 153, 0.25); color: #a7f3d0; font-weight: 600; }

      .icon-btn {
        appearance: none; border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(18, 24, 34, 0.72);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        color: #e2e8f0; height: 25px; padding: 0 7px; border-radius: 6px;
        display: inline-flex; align-items: center; justify-content: center; gap: 4px;
        font-size: 10.5px; cursor: pointer;
      }
      .icon-btn:hover { background: rgba(255, 255, 255, 0.18); color: #fff; }

      .progress-row { display: flex; align-items: center; gap: 8px; }
      .progress-track { flex: 1; height: 12px; display: flex; align-items: center; cursor: pointer; }
      .progress-bg { width: 100%; height: 3.5px; border-radius: 999px; background: rgba(255, 255, 255, 0.22); overflow: hidden; }
      .progress-track:hover .progress-bg { height: 5.5px; }
      .progress-fill { height: 100%; width: 0%; background: #34d399; border-radius: 999px; }
      .time-label { font-size: 10px; font-variant-numeric: tabular-nums; color: rgba(226, 232, 240, 0.85); white-space: nowrap; }

      .ctrl-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
      .ctrl-left { display: flex; align-items: center; gap: 2px; }
      .mini-ctrl {
        appearance: none; border: none; background: transparent; color: #f1f5f9;
        width: 24px; height: 22px; border-radius: 5px;
        display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      }
      .mini-ctrl:hover { background: rgba(255, 255, 255, 0.15); }
      .rate-btn {
        appearance: none; border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.08); color: #e2e8f0;
        border-radius: 5px; padding: 2px 5px; font-size: 10px; font-weight: 600; cursor: pointer;
      }

      .sliders-inline {
        display: inline-flex; align-items: center; gap: 5px;
      }
      .gecko-pill {
        display: inline-flex; align-items: center; gap: 4px;
        background: rgba(18, 24, 34, 0.76); border: 1px solid rgba(52, 211, 153, 0.32);
        border-radius: 999px; padding: 2px 7px; font-size: 10px; color: #d1fae5;
      }
      .gecko-pill input[type="range"] { width: 42px; height: 3px; accent-color: #34d399; cursor: pointer; }
      .gecko-pct { min-width: 24px; text-align: right; font-weight: 600; color: #6ee7b7; font-variant-numeric: tabular-nums; }

      /* 8-Way Direct Resize Handles on Borderless Window (with visible 4-corner brackets on hover!) */
      .rz { position: absolute; z-index: 55; }
      .rz-n  { top: 0; left: 22px; right: 22px; height: 8px; cursor: ns-resize; }
      .rz-s  { bottom: 0; left: 22px; right: 22px; height: 8px; cursor: ns-resize; }
      .rz-e  { right: 0; top: 22px; bottom: 22px; width: 10px; cursor: ew-resize; }
      .rz-w  { left: 0; top: 22px; bottom: 22px; width: 10px; cursor: ew-resize; }
      .rz-nw, .rz-ne, .rz-sw, .rz-se {
        width: 20px; height: 20px; z-index: 60;
        opacity: 0; transition: opacity 0.15s ease;
      }
      .rz-nw { top: 0; left: 0; cursor: nwse-resize; border-top: 2.5px solid rgba(52, 211, 153, 0.9); border-left: 2.5px solid rgba(52, 211, 153, 0.9); border-top-left-radius: 11px; }
      .rz-ne { top: 0; right: 0; cursor: nesw-resize; border-top: 2.5px solid rgba(52, 211, 153, 0.9); border-right: 2.5px solid rgba(52, 211, 153, 0.9); border-top-right-radius: 11px; }
      .rz-sw { bottom: 0; left: 0; cursor: nesw-resize; border-bottom: 2.5px solid rgba(52, 211, 153, 0.9); border-left: 2.5px solid rgba(52, 211, 153, 0.9); border-bottom-left-radius: 11px; }
      .rz-se {
        right: 0; bottom: 0; cursor: nwse-resize;
        border-bottom: 2.5px solid rgba(52, 211, 153, 0.9); border-right: 2.5px solid rgba(52, 211, 153, 0.9); border-bottom-right-radius: 11px;
        color: rgba(110, 231, 183, 0.95);
        display: flex; align-items: flex-end; justify-content: flex-end; padding: 3px;
      }
      .pip-root.hovered:not(.boss-active) .rz-nw,
      .pip-root.hovered:not(.boss-active) .rz-ne,
      .pip-root.hovered:not(.boss-active) .rz-sw,
      .pip-root.hovered:not(.boss-active) .rz-se { opacity: 1; }

      .idle-card {
        padding: 18px 20px; border-radius: 14px;
        background: rgba(14, 20, 28, 0.92); backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #e2e8f0; font-size: 12px; line-height: 1.55; text-align: center; max-width: 90%;
      }
      .idle-btns { margin-top: 12px; display: flex; justify-content: center; gap: 8px; }
      .cta-btn {
        appearance: none; border: 1px solid rgba(52, 211, 153, 0.45);
        background: linear-gradient(135deg, #059669, #0d9488);
        color: #fff; font-size: 11.5px; font-weight: 600; padding: 6px 12px; border-radius: 7px; cursor: pointer;
      }
      .cta-btn.sec { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.18); }

      .pip-root.boss-active .stage,
      .pip-root.boss-active .idle-card { opacity: 0 !important; pointer-events: none !important; }
      .boss-recover {
        position: absolute; display: none; padding: 6px 12px; border-radius: 999px;
        background: rgba(15, 23, 32, 0.9); border: 1px solid rgba(251, 191, 36, 0.5);
        color: #fde68a; font-size: 11px; font-weight: 600; cursor: pointer; z-index: 40;
      }
      .pip-root.boss-active.hovered .boss-recover { display: inline-flex; }
    </style>
    <style id="dynFeather"></style>
  </head>
  <body>
    <svg style="position:absolute;width:0;height:0;pointer-events:none" xmlns="http://www.w3.org/2000/svg">
      <defs id="svgDefs"></defs>
    </svg>

    <div class="pip-root" id="pipRoot" data-mode="projector">
      <div class="hud-top">
        <div class="pill-group">
          <button class="seg-btn active" data-mode="projector" title="环境变色：随底下代码/表格/文档/壁纸实时平滑变换同系保护色">变色</button>
          <button class="seg-btn" data-mode="emboss" title="迷彩斑纹：化为同色系代码行纹与微米鳞点，远看像代码数据、近看画面清晰">斑纹</button>
          <button class="seg-btn" data-mode="cinema" title="应激隐身：平时通透原彩，敲键盘打字时像活体变色龙一样0.25秒自动褪色潜伏，停手恢复">应激</button>
        </div>
        <div style="display:flex;align-items:center;gap:3px">
          <button class="icon-btn" data-scale="0.85" title="缩小窗口 (-)">−</button>
          <button class="icon-btn" data-scale="1.18" title="放大窗口 (+)">+</button>
          <button class="icon-btn" data-size="280" title="小尺寸">S</button>
          <button class="icon-btn" data-size="392" title="中尺寸">M</button>
          <button class="icon-btn" data-size="520" title="大尺寸">L</button>
          <button class="icon-btn" id="btnHubToggle" title="打开独立隐蔽搜片浏览器（不遮挡小窗，支持B站/全网搜片）">搜片</button>
          <button class="icon-btn" id="btnStealthSub" title="代码日志字幕条：即时开启终端日志伪装，并自动捕获视频字幕/弹幕">日志</button>
          <button class="icon-btn" id="btnThrough" title="开启鼠标穿透（鼠标直接穿透小窗操作底下内容，在顶部灵动岛或按 ⌃⇧M 恢复）"></button>
          <button class="icon-btn" id="btnBoss" title="老板键隐藏"></button>
        </div>
      </div>

      <div class="stage" id="stage" style="display:none">
        <canvas id="streamCanvas" class="media-el" width="512" height="288"></canvas>
        <video id="localVideo" class="media-el" style="display:none" autoplay loop playsinline></video>
        <div class="subtitle-el" id="subtitleEl"></div>
      </div>

      <div class="hud-bottom" id="hudBottom" style="display:none">
        <div class="progress-row">
          <div class="progress-track" id="progressTrack">
            <div class="progress-bg"><div class="progress-fill" id="progressFill"></div></div>
          </div>
          <span class="time-label" id="timeLabel">00:00 / 00:00</span>
        </div>

        <div class="ctrl-row">
          <div class="ctrl-left">
            <button class="mini-ctrl" id="btnPlayPause"></button>
            <button class="mini-ctrl" id="btnBack10"></button>
            <button class="mini-ctrl" id="btnFwd10"></button>
            <button class="mini-ctrl" id="btnMute"></button>
            <button class="rate-btn" id="btnRate">1.0x</button>
          </div>

          <div class="sliders-inline">
            <label class="gecko-pill" title="变色融合浓度（底层颜色始终透出）">
              <span>浓度</span>
              <input type="range" id="rngStealth" min="10" max="95" value="58" />
              <span class="gecko-pct" id="lblStealth">58%</span>
            </label>
            <label class="gecko-pill" title="边框柔和消隐：让视频四周边框像雾一样融进背景">
              <span>柔边</span>
              <input type="range" id="rngFeather" min="0" max="85" value="28" />
              <span class="gecko-pct" id="lblFeather">28%</span>
            </label>
          </div>
        </div>
      </div>

      <div class="rz rz-n" data-dir="n"></div>
      <div class="rz rz-s" data-dir="s"></div>
      <div class="rz rz-e" data-dir="e"></div>
      <div class="rz rz-w" data-dir="w"></div>
      <div class="rz rz-nw" data-dir="nw"></div>
      <div class="rz rz-ne" data-dir="ne"></div>
      <div class="rz rz-sw" data-dir="sw"></div>
      <div class="rz rz-se" data-dir="se" id="cornerGrip" title="按住拖拽调整小窗尺寸"></div>

      <div class="idle-card" id="idleCard">
        <div style="font-size:13.5px;font-weight:700;color:#fff;margin-bottom:4px">变色龙画中画已就绪</div>
        <div style="color:#94a3b8">打开独立「隐蔽搜片浏览器」全网找片（不遮挡小窗），或在浏览器视频上直接点「桌面变色龙小窗」：</div>
        <div class="idle-btns" style="flex-wrap:wrap">
          <button class="cta-btn" id="btnOpenBrowser">打开隐蔽搜片浏览器</button>
          <button class="cta-btn sec" id="btnTryDemo">演示视频</button>
          <button class="cta-btn sec" id="btnOpenMp4">本地 MP4</button>
        </div>
      </div>

      <button class="boss-recover" id="btnRecoverBoss">已隐藏并暂停 · 点击恢复播放</button>
    </div>

    <canvas id="demoGenCanvas" width="480" height="270" style="display:none"></canvas>

    <script src="gecko-core.js?v=5.4"></script>
    <script>
      if (!window.GeckoCore) {
        document.write('<script src="../extension/gecko-core.js?v=5.4"><\/script>');
      }
    </script>
    <script src="chameleon-stats.js?v=5.4"></script>
    <script>
      if (!window.ChameleonStats) {
        document.write('<script src="../extension/chameleon-stats.js?v=5.4"><\/script>');
      }
    </script>
    <script>
      (function () {
        const Core = window.GeckoCore;
        let state = { ...Core.DEFAULT_STATE };
        let player = { paused: true, currentTime: 0, duration: 180, muted: false, volume: 1.0, playbackRate: 1.0 };
        let isHovering = false;
        let isTyping = false;
        let hasLiveChromeStream = false;
        let demoRunning = false;
        let lastPlayerSyncAt = 0;
        let decodingBitmap = false;
        let ws = null;

        const root = document.getElementById("pipRoot");
        const svgDefs = document.getElementById("svgDefs");
        const stage = document.getElementById("stage");
        const hudBottom = document.getElementById("hudBottom");
        const idleCard = document.getElementById("idleCard");
        const streamCanvas = document.getElementById("streamCanvas");
        const localVideo = document.getElementById("localVideo");
        const dynFeather = document.getElementById("dynFeather");
        const subtitleEl = document.getElementById("subtitleEl");

        // -------------------------------------------------------------------
        // 60-120Hz Apple Metal WebGL Living-Chameleon Biological Skin Engine
        // Eliminates WebKit's slow CPU SVG <filter> completely in WKWebView!
        // -------------------------------------------------------------------
        const skinAnim = {
          bg: [0.09, 0.11, 0.14],
          accent: [0.22, 0.74, 0.97],
          pivot: 0.48,
          stress: 0.0,
          rafId: 0,
        };

        function createWebGlProjector(canvas) {
          const gl =
            canvas.getContext("webgl", {
              alpha: true,
              premultipliedAlpha: true,
              preserveDrawingBuffer: false,
              antialias: false,
              depth: false,
              stencil: false,
              powerPreference: "high-performance",
            }) || null;
          if (!gl) return null;

          const vsSrc = `
            attribute vec2 aPos;
            varying vec2 vUv;
            void main() {
              vUv = vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5);
              gl_Position = vec4(aPos, 0.0, 1.0);
            }
          `;
          const fsSrc = `
            precision mediump float;
            varying vec2 vUv;
            uniform sampler2D uTex;
            uniform int uMode;
            uniform float uIntensity;
            uniform float uPivot;
            uniform float uFeather;
            uniform vec3 uBgRgb;
            uniform vec3 uAccentRgb;
            uniform float uStress;
            uniform vec2 uResolution;
            uniform vec2 uTexel;

            void main() {
              float mask = 1.0;
              if (uFeather > 0.005) {
                float span = 0.025 + uFeather * 0.42;
                float fx = smoothstep(0.0, span, vUv.x) * smoothstep(0.0, span, 1.0 - vUv.x);
                float fy = smoothstep(0.0, span, vUv.y) * smoothstep(0.0, span, 1.0 - vUv.y);
                vec2 d = (vUv - vec2(0.5)) * 2.0;
                float r = pow(pow(abs(d.x), 2.4) + pow(abs(d.y), 2.4), 1.0 / 2.4);
                float innerR = max(0.18, 1.02 - uFeather * 0.82);
                float oval = 1.0 - smoothstep(innerR, 1.03, r);
                mask = pow(clamp(fx * fy, 0.0, 1.0), 0.85) * mix(1.0, oval, clamp(uFeather * 1.25, 0.0, 1.0));
              }
              if (mask <= 0.002) {
                gl_FragColor = vec4(0.0);
                return;
              }

              vec4 src = texture2D(uTex, vUv);
              float lum = dot(src.rgb, vec3(0.2126, 0.7152, 0.0722));
              vec3 hiPigment = mix(vec3(1.0), clamp(uAccentRgb * 1.25 + vec3(0.12), 0.0, 1.0), 0.74);
              vec3 loPigment = mix(vec3(0.0), clamp(uAccentRgb * 0.38 + uBgRgb * 0.18, 0.0, 1.0), 0.68);

              // Mode 0: 环境变色 — Living Chromatophore Color-Shift
              if (uMode == 0) {
                float k = clamp(uIntensity * 0.94 * mix(1.0, 0.84, uStress), 0.06, 0.94);
                float cLum = clamp((lum - uPivot) * 1.18 + uPivot, 0.0, 1.0);
                if (cLum < uPivot) {
                  float aDark = clamp(k * ((uPivot - cLum) / max(0.05, uPivot)), 0.0, 0.95) * mask;
                  gl_FragColor = vec4(loPigment * aDark, aDark);
                } else {
                  float aLight = clamp(k * ((cLum - uPivot) / max(0.05, 1.0 - uPivot)), 0.0, 0.95) * mask;
                  gl_FragColor = vec4(hiPigment * aLight, aLight);
                }
                return;
              }

              // Mode 1: 迷彩斑纹 — Staggered Chameleon Dermal Scales / Code-Line Pattern
              if (uMode == 1) {
                vec2 px = vUv * max(uResolution, vec2(256.0, 144.0));
                float rowIdx = floor(px.y / 3.0);
                float rowWave = 0.76 + 0.24 * sin(px.y * 2.0944);
                float stagger = mod(rowIdx, 2.0) * 2.5;
                float cellDot = 0.78 + 0.22 * sin((px.x + stagger) * 1.2566);
                float camoGrid = mix(1.0, rowWave * cellDot, 0.76);

                float lumR = dot(texture2D(uTex, vUv + vec2(uTexel.x, 0.0)).rgb, vec3(0.2126, 0.7152, 0.0722));
                float lumD = dot(texture2D(uTex, vUv + vec2(0.0, uTexel.y)).rgb, vec3(0.2126, 0.7152, 0.0722));
                float edgeBoost = clamp((abs(lum - lumR) + abs(lum - lumD)) * 2.4, 0.0, 0.45);
                float cLum = clamp((lum - uPivot) * (1.28 + edgeBoost) + uPivot, 0.0, 1.0);
                float k = clamp(uIntensity * 0.95 * mix(1.0, 0.85, uStress), 0.08, 0.95);
                if (cLum < uPivot) {
                  float aDark = clamp(k * ((uPivot - cLum) / max(0.05, uPivot)), 0.0, 0.95) * mask * camoGrid;
                  gl_FragColor = vec4(loPigment * aDark, aDark);
                } else {
                  float aLight = clamp(k * ((cLum - uPivot) / max(0.05, 1.0 - uPivot)), 0.0, 0.95) * mask * camoGrid;

              }

              // Mode 2: 应激隐身 — Bio-Reflex Typing Camouflage (vivid when idle, instant fade+camo when typing)
              float chroma = max(src.r, max(src.g, src.b)) - min(src.r, min(src.g, src.b));
              float basePull = clamp((1.0 - uIntensity) * 0.40 + 0.08, 0.08, 0.46);
              float envPull = mix(basePull, 0.78, uStress);
              vec3 boosted = clamp(src.rgb * 1.08, 0.0, 1.0);
              vec3 targetCol = mix(uBgRgb, uAccentRgb, clamp(0.25 + 0.50 * lum, 0.25, 0.75));
              vec3 harmonized = mix(boosted, targetCol, envPull);
              float salience = clamp(abs(lum - uPivot) * 1.50 + chroma * 0.90 + 0.28, 0.26, 1.0);
              float calmAlpha = clamp(uIntensity * 0.90 * mix(salience, 1.0, uIntensity * 0.55), 0.06, 0.92);
              float a = calmAlpha * (1.0 - uStress * 0.58) * mask;
              gl_FragColor = vec4(harmonized * a, a);

          function compile(type, src) {
            const sh = gl.createShader(type);
            gl.shaderSource(sh, src);
            gl.compileShader(sh);
            return gl.getShaderParameter(sh, gl.COMPILE_STATUS) ? sh : null;

          const vs = compile(gl.VERTEX_SHADER, vsSrc);

          if (!vs || !fs) return null;

          const prog = gl.createProgram();
          gl.attachShader(prog, vs);
          gl.attachShader(prog, fs);
          gl.linkProgram(prog);
          if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
          gl.useProgram(prog);

          const buf = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buf);
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
          const locPos = gl.getAttribLocation(prog, "aPos");
          gl.enableVertexAttribArray(locPos);
          gl.vertexAttribPointer(locPos, 2, gl.FLOAT, false, 0, 0);

          const tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

          const uMode = gl.getUniformLocation(prog, "uMode");
          const uIntensity = gl.getUniformLocation(prog, "uIntensity");
          const uPivot = gl.getUniformLocation(prog, "uPivot");
          const uFeather = gl.getUniformLocation(prog, "uFeather");
          const uBgRgb = gl.getUniformLocation(prog, "uBgRgb");
          const uAccentRgb = gl.getUniformLocation(prog, "uAccentRgb");
          const uStress = gl.getUniformLocation(prog, "uStress");
          const uResolution = gl.getUniformLocation(prog, "uResolution");
          const uTexel = gl.getUniformLocation(prog, "uTexel");
          let hasTexture = false;
          let texW = 512;
          let texH = 288;

          function drawCurrent(st) {
            if (!hasTexture) return;
            if (canvas.width !== texW || canvas.height !== texH) {
              canvas.width = texW;
              canvas.height = texH;
              gl.viewport(0, 0, texW, texH);
            }
            const m = st.mode === "emboss" ? 1 : st.mode === "cinema" ? 2 : 0;
            gl.clearColor(0.0, 0.0, 0.0, 0.0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.uniform1i(uMode, m);
            gl.uniform1f(uIntensity, Core.clamp(Number(st.stealth ?? 58) / 100, 0.08, 0.96));
            gl.uniform1f(uPivot, skinAnim.pivot);
            gl.uniform1f(uFeather, Core.clamp(Number(st.feather ?? 28) / 100, 0.0, 0.85));
            gl.uniform3f(uBgRgb, skinAnim.bg[0], skinAnim.bg[1], skinAnim.bg[2]);

          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            uploadAndDraw(source, w, h, st) {

              gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
              hasTexture = true;
              drawCurrent(st);
            },
            redraw(st) {
              drawCurrent(st);
            },
          };
        }

        const glProjector = createWebGlProjector(streamCanvas);

        document.getElementById("btnThrough").innerHTML = `${Core.ICONS.cursorThrough}<span style="font-size:10px">穿透</span>`;

        function escapeHtml(str) {

        function buildAmbientStealthLine() {
          const cur = Core.formatTime(player.currentTime || 0);
          const dur = Core.formatTime(player.duration || 0);
          if (player.paused) {
            return `worker::idle — pipeline paused at ${cur} · awaiting signal`;

          const lines = [
            `stream::chunk — offset=${cur}/${dur} · rate=${player.playbackRate || 1}x · status=OK`,
            `cache::lru — ring_buffer=60fps · zero_drop=true · mem=nominal`,
            `worker::sync — frame_pipeline=active · latency<2ms [OK]`,

        function sendPlayerCmd(action, extra = {}) {

        function startBuiltInDemo() {

            ctx.fillStyle = "#090d16";

            ctx.fillRect(cx - 11, cy - 6, 6, 8);

            ctx.textAlign = "center";
            ctx.lineWidth = 4.2;
            ctx.strokeStyle = "#000";
            const msg = "60fps 变色龙拟态：拖到红绿或代码背景上，底色原样透出！";
            ctx.strokeText(msg, w / 2, h - 22);
            ctx.fillStyle = "#fff";
            ctx.fillText(msg, w / 2, h - 22);

            const demoSubtitles = [
              "变色龙拟态 60fps 运行中：底层代码、Excel 与红绿色块原样透出",
              "开启「日志字幕」后，视频对白自动伪装为终端编译日志，静音看剧超隐蔽",
              "顶部灵动岛支持「AI防窥雷达」：本地检测背后有人靠近自动秒隐",
              "点击「网页直连」可直接粘贴 B站 / YouTube 链接，免装浏览器插件",
            ];
            const subIdx = Math.floor(player.currentTime / 4.5) % demoSubtitles.length;
            if (state.stealthSubtitle) {
              if (lastRawSubtitle !== demoSubtitles[subIdx]) renderSubtitle(demoSubtitles[subIdx]);
            } else if (lastRawSubtitle && demoSubtitles.includes(lastRawSubtitle)) {
              renderSubtitle("");
            }

            if (glProjector) {
              glProjector.uploadAndDraw(c, w, h, state);
            }
            renderPlayerControls(false);
            requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
          if (glProjector) {
            streamCanvas.style.display = "block";
            localVideo.style.display = "none";
          } else {
            streamCanvas.style.display = "none";
            localVideo.style.display = "block";
            localVideo.srcObject = c.captureStream(60);
            localVideo.play().catch(() => {});
          }
          stage.style.display = "flex";
          hudBottom.style.display = "flex";
          idleCard.style.display = "none";
          render();
          notifyHostPlayer(true);
        }

        // Pump local MP4 <video> frames into 60-120Hz WebGL Metal Projector when playing a local file
        let localGlLoopRunning = false;
        function startLocalVideoGlPump() {
          if (!glProjector || localGlLoopRunning) return;
          localGlLoopRunning = true;
          function pump() {
            if (hasLiveChromeStream || demoRunning || !localVideo.src) {
              localGlLoopRunning = false;
              return;
            }
            if (localVideo.readyState >= 2 && localVideo.videoWidth > 0) {
              glProjector.uploadAndDraw(localVideo, localVideo.videoWidth, localVideo.videoHeight, state);
            }
            requestAnimationFrame(pump);
          }
          requestAnimationFrame(pump);
        }

        document.getElementById("btnOpenBrowser")?.addEventListener("click", () => {
          postNative({ action: "openSearchBrowser" });
        });
        document.getElementById("btnHubToggle")?.addEventListener("click", (e) => {
          e.stopPropagation();
          postNative({ action: "openSearchBrowser" });
        });

        document.getElementById("btnTryDemo").addEventListener("click", startBuiltInDemo);
        document.getElementById("btnOpenMp4").addEventListener("click", () => {
          postNative({ action: "openLocalMp4" });
        });

        let pendingFrameData = null;
        let activeDecodeSeq = 0;
        const decodeImg = new Image();
        decodeImg.decoding = "async";

        function sendFrameAck() {
          if (ws && ws.readyState === WebSocket.OPEN) {
            try {
              ws.send("ack");
            } catch (_) {}
          }
        }

        async function decodeAndDrawRaw(raw) {
          const blob = raw instanceof Blob ? raw : new Blob([raw], { type: "image/jpeg" });
          if (typeof createImageBitmap === "function") {
            try {
              const bmp = await createImageBitmap(blob);
              try {
                const vw = bmp.width || 448;
                const vh = bmp.height || 252;
                if (glProjector) {
                  glProjector.uploadAndDraw(bmp, vw, vh, state);
                } else if (fallbackCtx) {
                  if (streamCanvas.width !== vw || streamCanvas.height !== vh) {
                    streamCanvas.width = vw;
                    streamCanvas.height = vh;
                  }
                  fallbackCtx.drawImage(bmp, 0, 0);
                }
                return;
              } finally {
                try { bmp.close(); } catch (_) {}
              }
            } catch (_) {}
          }

          const objUrl = URL.createObjectURL(blob);
          try {
            decodeImg.src = objUrl;
            await decodeImg.decode();
            const vw = decodeImg.naturalWidth || 448;
            const vh = decodeImg.naturalHeight || 252;
            if (glProjector) {
              glProjector.uploadAndDraw(decodeImg, vw, vh, state);
            } else if (fallbackCtx) {
              if (streamCanvas.width !== vw || streamCanvas.height !== vh) {
                streamCanvas.width = vw;
                streamCanvas.height = vh;
              }
              fallbackCtx.drawImage(decodeImg, 0, 0);
            }
          } finally {
            URL.revokeObjectURL(objUrl);
          }
        }

        function consumeNextStreamFrame() {
          if (decodingBitmap || !pendingFrameData) return;
          const raw = pendingFrameData;
          pendingFrameData = null;
          decodingBitmap = true;
          const curSeq = ++activeDecodeSeq;
          let finished = false;
          const finishOne = () => {
            if (finished) return;
            finished = true;
            clearTimeout(stuckTimer);
            decodingBitmap = false;
            sendFrameAck();
            if (pendingFrameData) consumeNextStreamFrame();
          };
          const stuckTimer = setTimeout(() => {
            if (curSeq === activeDecodeSeq) finishOne();
          }, 350);

          decodeAndDrawRaw(raw)
            .catch((err) => console.warn("[ChameleonPiP] frame decode err:", err))
            .finally(() => finishOne());
        }

        const GHOST_WS_PORTS = [27182, 51937];
        let ghostPortIdx = 0;

        function connectHub() {
          try {
            const port = GHOST_WS_PORTS[ghostPortIdx % GHOST_WS_PORTS.length];
            let opened = false;
            ws = new WebSocket(`ws://127.0.0.1:${port}`);
            ws.binaryType = "arraybuffer";
            ws.onopen = () => {
              opened = true;
              ghostPortIdx = 0;
              ws.send(JSON.stringify({ type: "register", role: "ghostView" }));
              pushVideoPlaybackState(true);
            };
            ws.onmessage = (ev) => {
              if (ev.data instanceof ArrayBuffer || ev.data instanceof Blob) {
                lastVideoFrameAt = performance.now();
                if (!hasLiveChromeStream) {
                  hasLiveChromeStream = true;
                  demoRunning = false;
                  postNative({ action: "chromeStreamStarted" });
                  localVideo.pause();
                  localVideo.srcObject = null;
                  localVideo.style.display = "none";
                  streamCanvas.style.display = "block";
                  stage.style.display = "flex";
                  hudBottom.style.display = "flex";
                  idleCard.style.display = "none";
                  render();
                }
                if (pendingFrameData) {
                  // Return credit for overwritten intermediate frame so hub stays in lockstep
                  sendFrameAck();
                }
                pendingFrameData = ev.data;
                consumeNextStreamFrame();
                return;
              }
              if (typeof ev.data === "string") {
                try {
                  const msg = JSON.parse(ev.data);
                  if (msg.type === "meta") {
                    // Only sync player progress & subtitle from periodic heartbeats!
                    // Never clobber the user's mode / stealth / feather set on the Mac Dynamic Island bar!
                    if (msg.state && typeof msg.state.mirrorSubtitles === "boolean") {
                      state.mirrorSubtitles = msg.state.mirrorSubtitles;
                    }
                    if (msg.state && typeof msg.state.stealthSubtitle === "boolean") {
                      if (msg.state.stealthSubtitle && !state.stealthSubtitle) {
                        stealthSubActivatedAt = performance.now();
                        state.mirrorSubtitles = true;
                      }
                      state.stealthSubtitle = msg.state.stealthSubtitle;
                    }
                    if (msg.player) {
                      const nowTs = performance.now();
                      const incoming = { ...msg.player };
                      if (nowTs < mutedLockUntil) delete incoming.muted;
                      if (nowTs < pausedLockUntil) delete incoming.paused;
                      player = { ...player, ...incoming };
                    }
                    renderSubtitle(state.mirrorSubtitles && msg.subtitle ? msg.subtitle : "");
                    renderPlayerControls(false);
                  } else if (msg.type === "statePatch" && msg.patch) {
                    const p = { ...msg.patch };
                    if (p.mode && !["projector", "emboss", "cinema"].includes(p.mode)) {
                      delete p.mode;
                    }
                    if (p.stealthSubtitle && !state.stealthSubtitle) {
                      stealthSubActivatedAt = performance.now();
                      p.mirrorSubtitles = true;
                    }
                    state = { ...state, ...p };
                    render();
                    postNative({ action: "stateChanged", state });
                  } else if (msg.type === "membershipUpdated" && msg.membership) {
                    const S = window.ChameleonStats;
                    if (S) {
                      const saved = S.saveMembership(msg.membership);
                      postNative({
                        action: "membershipChanged",
                        isPro: S.isProMember(saved),
                        tier: saved.tier || "free",
                        planName: saved.planName || "Free 免费版",
                      });
                    }
                  } else if (msg.type === "streamStopped") {
                    hasLiveChromeStream = false;
                    stage.style.display = "none";
                    hudBottom.style.display = "none";
                    idleCard.style.display = "block";
                    player.paused = true;
                    notifyHostPlayer(true);
                  }
                } catch (_) {}
              }
            };
            ws.onclose = () => {
              if (!opened) ghostPortIdx = (ghostPortIdx + 1) % GHOST_WS_PORTS.length;
              setTimeout(connectHub, opened ? 800 : 250);
            };
            ws.onerror = () => {
              try { ws.close(); } catch (_) {}
            };
          } catch (_) {
            ghostPortIdx = (ghostPortIdx + 1) % GHOST_WS_PORTS.length;
            setTimeout(connectHub, 500);
          }
        }
        connectHub();

        // Click on stage toggles Play/Pause; drag moves window in Electron desktop mode
        let downPt = null;
        stage.addEventListener("mousedown", (e) => {
          downPt = { x: e.screenX, y: e.screenY };
          if (window.GeckoDesktopBridge?.send && e.button === 0) {
            window.GeckoDesktopBridge.send({ action: "beginDrag" });
          }
        });
        window.addEventListener("mouseup", () => {
          if (window.GeckoDesktopBridge?.send) {
            window.GeckoDesktopBridge.send({ action: "endPointerTrack" });
          }
        });
        stage.addEventListener("mouseup", (e) => {
          if (downPt && Math.hypot(e.screenX - downPt.x, e.screenY - downPt.y) < 5 && (state.hoverReveal || isHovering)) {
            sendPlayerCmd("togglePlay");
          }
          downPt = null;
        });

        idleCard.addEventListener("mousedown", (e) => {
          if (e.target.closest("button")) return;
          if (window.GeckoDesktopBridge?.send && e.button === 0) {
            window.GeckoDesktopBridge.send({ action: "beginDrag" });
          }
        });

        const track = document.getElementById("progressTrack");
        let scrubbing = false;
        const seekFromEv = (e) => {
          const r = track.getBoundingClientRect();
          const ratio = Core.clamp((e.clientX - r.left) / Math.max(1, r.width), 0, 1);
          sendPlayerCmd("seekTo", { value: ratio * (player.duration || 180) });
        };
        track.addEventListener("mousedown", (e) => { e.stopPropagation(); scrubbing = true; seekFromEv(e); });
        window.addEventListener("mousemove", (e) => { if (scrubbing) seekFromEv(e); });
        window.addEventListener("mouseup", () => { scrubbing = false; });

        document.getElementById("btnPlayPause").addEventListener("click", () => sendPlayerCmd("togglePlay"));
        document.getElementById("btnBack10").addEventListener("click", () => sendPlayerCmd("seek", { delta: -10 }));
        document.getElementById("btnFwd10").addEventListener("click", () => sendPlayerCmd("seek", { delta: 10 }));
        document.getElementById("btnMute").addEventListener("click", () => sendPlayerCmd("toggleMute"));

        const rates = [1.0, 1.25, 1.5, 2.0];
        document.getElementById("btnRate").addEventListener("click", () => {
          const next = rates[(rates.indexOf(player.playbackRate) + 1) % rates.length];
          player.playbackRate = next;
          sendPlayerCmd("setRate", { value: next });
          renderPlayerControls();
        });

        function syncMembershipWithNative() {
          const S = window.ChameleonStats;
          if (!S) return;
          const cur = S.loadMembership();
          postNative({
            action: "membershipChanged",
            isPro: S.isProMember(cur),
            tier: cur.tier || "free",
            planName: cur.planName || "Free 免费版",
          });
          S.refreshMembership(S.loadProfile().userId).then((fresh) => {
            postNative({
              action: "membershipChanged",
              isPro: S.isProMember(fresh),
              tier: fresh.tier || "free",
              planName: fresh.planName || "Free 免费版",
            });
          });
        }
        syncMembershipWithNative();

        // All 3 Chameleon visual modes (变色 / 斑纹 / 应激) are 100% FREE forever!
        document.querySelectorAll(".seg-btn").forEach((b) => {
          b.addEventListener("click", () => {
            broadcastStateUpdate({ mode: b.dataset.mode });
          });
        });
        document.getElementById("btnStealthSub")?.addEventListener("click", (e) => {
          e.stopPropagation();
          const next = !state.stealthSubtitle;
          if (next) stealthSubActivatedAt = performance.now();
          broadcastStateUpdate({
            stealthSubtitle: next,
            mirrorSubtitles: next ? true : state.mirrorSubtitles,
          });
        });
        document.querySelectorAll("[data-size]").forEach((b) => {
          b.addEventListener("click", () => {
            const w = Number(b.dataset.size);
            postNative({ action: "resizeWindow", width: w, height: Math.round((w * 9) / 16) });
          });
        });
        document.querySelectorAll("[data-scale]").forEach((b) => {
          b.addEventListener("click", () => {
            postNative({ action: "scaleBy", factor: Number(b.dataset.scale) });
          });
        });

        document.querySelectorAll(".rz").forEach((h) => {
          h.addEventListener("mousedown", (e) => {
            e.stopPropagation();
            e.preventDefault();
            postNative({ action: "beginResize", dir: h.dataset.dir });
          });
        });

        document.getElementById("rngStealth").addEventListener("input", (e) => {
          broadcastStateUpdate({ stealth: Number(e.target.value) });
        });
        document.getElementById("rngFeather")?.addEventListener("input", (e) => {
          broadcastStateUpdate({ feather: Number(e.target.value) });
        });

        let ocrLocalCanvas = null;
        let ocrLocalCtx = null;
        setInterval(() => {
          if (!hasNativeHost || !state.stealthSubtitle || state.bossMode || hasLiveChromeStream) return;
          if (!localVideo.src || localVideo.paused || localVideo.ended || localVideo.readyState < 2) return;
          try {
            if (!ocrLocalCanvas) {
              ocrLocalCanvas = document.createElement("canvas");
              ocrLocalCanvas.width = 448;
              ocrLocalCanvas.height = 252;
              ocrLocalCtx = ocrLocalCanvas.getContext("2d", { alpha: false });
            }
            if (!ocrLocalCtx) return;
            ocrLocalCtx.drawImage(localVideo, 0, 0, 448, 252);
            const dataUrl = ocrLocalCanvas.toDataURL("image/jpeg", 0.72);
            const comma = dataUrl.indexOf(",");
            if (comma > 0) {
              postNative({ action: "ocrLocalVideoFrame", b64: dataUrl.slice(comma + 1) });
            }
          } catch (_) {}
        }, 900);

        document.getElementById("btnThrough").addEventListener("click", (e) => {
          e.stopPropagation();
          applyHoverReveal(false, false);
          postNative({ action: "enableClickThrough" });
        });
        document.getElementById("btnBoss").addEventListener("click", () => postNative({ action: "setBoss", value: true }));
        document.getElementById("btnRecoverBoss").addEventListener("click", () => postNative({ action: "setBoss", value: false }));

        function computeSkinTargets() {
          const bg = Core.hexToRgb(state.bgColor || "#161b22");
          const acc = Core.hexToRgb(Core.deriveHabitatAccent(state.bgColor, state.archetype, state.accentColor));
          let targetPivot = 0.48;
          if (state.autoSense && state.bgColor) {
            const lum = Core.getLuminance(state.bgColor);
            if (lum > 0.86) targetPivot = 0.72;
            else if (lum < 0.14) targetPivot = 0.28;
          }
          return {
            bg: [bg.r / 255, bg.g / 255, bg.b / 255],
            accent: [acc.r / 255, acc.g / 255, acc.b / 255],
            pivot: targetPivot,
            stress: isTyping ? 1.0 : 0.0,
          };
        }

        function scheduleSkinMorph() {
          if (skinAnim.rafId) return;
          const step = () => {
            skinAnim.rafId = 0;
            const tgt = computeSkinTargets();
            let delta = 0;
            for (let i = 0; i < 3; i++) {
              const db = tgt.bg[i] - skinAnim.bg[i];
              skinAnim.bg[i] += db * 0.14;
              const da = tgt.accent[i] - skinAnim.accent[i];
              skinAnim.accent[i] += da * 0.14;
              delta = Math.max(delta, Math.abs(db), Math.abs(da));
            }
            const dp = tgt.pivot - skinAnim.pivot;
            skinAnim.pivot += dp * 0.14;
            const ds = tgt.stress - skinAnim.stress;
            skinAnim.stress += ds * 0.18;
            delta = Math.max(delta, Math.abs(dp), Math.abs(ds));

            if (glProjector) {
              glProjector.redraw(state);
            } else {
              render();
            }
            if (delta > 0.003) {
              skinAnim.rafId = requestAnimationFrame(step);
            } else {
              skinAnim.bg = tgt.bg;
              skinAnim.accent = tgt.accent;
              skinAnim.pivot = tgt.pivot;
              skinAnim.stress = tgt.stress;
              if (glProjector) glProjector.redraw(state);
            }
          };
          skinAnim.rafId = requestAnimationFrame(step);
        }

        window.GeckoNativeBridge = {
          setHovered(val, forcePeek = false) {
            applyHoverReveal(val, forcePeek);
          },
          onMacSensor(sensor) {
            isTyping = Boolean(sensor.isTyping);
            if (state.autoSense) {
              const patch = Core.computeAutoScenePatch(sensor, state);
              state.bgColor = patch.bgColor;
              state.accentColor = patch.accentColor;
              state.archetype = patch.archetype;
              state.inkColor = Core.deriveAutoInkColor(state.bgColor);
              renderSubtitle();
            }
            scheduleSkinMorph();
          },
          applyPatch(patch) {
            if (patch?.stealthSubtitle && !state.stealthSubtitle) {
              stealthSubActivatedAt = performance.now();
            }
            state = { ...state, ...patch };
            if (patch?.bgColor || patch?.accentColor || patch?.archetype) {
              scheduleSkinMorph();
            }
            render();
            if (ws?.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: "statePatch", patch }));
            }
          },
          execPlayerCmd(cmd) {
            sendPlayerCmd(cmd.action, cmd);
          },
          setBossMode(val) {
            state.bossMode = Boolean(val);
            render();
            notifyHostPlayer(true);
            if (ws?.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: "cmd", action: state.bossMode ? "pause" : "play" }));
            }
          },
          loadLocalVideo(fileUrl) {
            hasLiveChromeStream = false;
            demoRunning = false;
            localVideo.srcObject = null;
            localVideo.src = fileUrl;
            localVideo.muted = false;
            if (glProjector) {
              streamCanvas.style.display = "block";
              localVideo.style.display = "none";
              startLocalVideoGlPump();
            } else {
              streamCanvas.style.display = "none";
              localVideo.style.display = "block";
            }
            localVideo.play().catch(() => {});
            stage.style.display = "flex";
            hudBottom.style.display = "flex";
            idleCard.style.display = "none";
            render();
            notifyHostPlayer(true);
          },
        };

        // Automatically record slacking time & sync to global cloud leaderboard ONLY while an actual video is playing
        let pipPausedSec = 0;
        let tickCount = 0;
        setInterval(() => {
          const S = window.ChameleonStats;
          if (!S) return;
          const isActivelyPlaying = isRealVideoPlaying();
          if (isActivelyPlaying !== lastNotifiedActiveVideo) {
            notifyHostPlayer(true);
          }

          const p = S.loadProfile();
          if (isActivelyPlaying) {
            pipPausedSec = 0;
            p.totalSeconds = (p.totalSeconds || 0) + 1;
            p.todaySeconds = (p.todaySeconds || 0) + 1;
            p.currentStreakSeconds = (p.currentStreakSeconds || 0) + 1;
            if (p.currentStreakSeconds > (p.bestStreakSeconds || 0)) {
              p.bestStreakSeconds = p.currentStreakSeconds;
            }
            p.lastTickAt = Date.now();
            S.saveProfile(p);
          } else if (p.currentStreakSeconds > 0) {
            pipPausedSec += 1;
            if (state.bossMode || pipPausedSec > 10) {
              p.currentStreakSeconds = 0;
              if (state.bossMode) p.bossDodges = (p.bossDodges || 0) + 1;
              pipPausedSec = 0;
              S.saveProfile(p);
            }
          }

          tickCount += 1;
          pushVideoPlaybackState(tickCount % 2 === 0);
          if (state.stealthSubtitle && !lastRawSubtitle.trim() && tickCount % 2 === 0) {
            renderSubtitle();
          }

          if (isActivelyPlaying && tickCount % 12 === 0) {
            const modeLabel = `${state.mode === "emboss" ? "斑纹" : state.mode === "cinema" ? "应激" : "变色"} ${state.stealth}%`;
            fetch(`${S.getApiBase()}/api/heartbeat`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                userId: p.userId,
                nickname: p.nickname,
                city: p.city,
                country: p.country,
                regionCode: p.regionCode,
                industry: p.industry,
                mode: modeLabel,
                currentStreakSeconds: p.currentStreakSeconds,
                bestStreakSeconds: p.bestStreakSeconds,
                todaySeconds: p.todaySeconds,
                totalSeconds: p.totalSeconds,
                pkElo: p.pkElo,
                pkWins: p.pkWins,
                pkLosses: p.pkLosses,
                live: true,
              }),
            }).catch(() => {});
          }
        }, 1000);

        render();
      })();
    </script>
  </body>
